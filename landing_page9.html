<!DOCTYPE html>
<html lang="bn" data-theme="frost-dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AURA NORDIC™ — প্রিমিয়াম উইন্টার কালেকশন ২০২৬ | Arctic Shield Jacket & Hoodies</title>
    <meta name="description"
        content="কনকনে শীতের জন্য প্রিমিয়াম নর্ডিক উইন্ডপ্রুফ ও ওয়াটারপ্রুফ জ্যাকেট। ডাবল লেয়ার ফ্লিস ও মেমোরি কটন। ৫০% পর্যন্ত বিশাল ছাড় ও ক্যাশ অন ডেলিভারি।" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&family=Cabinet+Grotesk:wght@700;800;900&display=swap"
        rel="stylesheet" />

    <!-- Bootstrap 5 & FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

</head>

<body>
    <script>
        // Countdown Timer Loop
        function initTimer() {
            let totalSecs = 8 * 3600 + 42 * 60 + 19;
            setInterval(() => {
                if (totalSecs > 0) {
                    totalSecs--;
                    const h = Math.floor(totalSecs / 3600);
                    const m = Math.floor((totalSecs % 3600) / 60);
                    const s = totalSecs % 60;
                    document.getElementById('tHours').textContent = h < 10 ? '0' + h : h; document.getElementById('tMins').textContent = m
                        < 10 ? '0' + m : m; document.getElementById('tSecs').textContent = s < 10 ? '0' + s : s;
                }
            }, 1000);
        } // Live
        // Order Toast Notifications Simulation 
        const sampleOrders = [{
            name: "মাহমুদ ভাই, ধানমন্ডি",
            item: "১টি Obsidian Black (L)",
            img: "https://images.unsplash.com/photo-1544923246-77307dd654cb?q=80&w=200&auto=format&fit=crop"
        }, {
            name: "সাকিব চৌধুরী, সিলেট", item: "২টি কম্বো প্যাক (Navy + Olive)",
            img: "https://images.unsplash.com/photo-1551028719-00167b16eac5?q=80&w=200&auto=format&fit=crop"
        }, {
            name: "ফয়সাল মাহমুদ, চট্টগ্রাম", item: "১টি Frost Charcoal (XL)",
            img: "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=200&auto=format&fit=crop"
        }, {
            name: "আহসান হাবীব, খুলনা", item: "৩টি ফ্যামিলি প্যাক",
            img: "https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?q=80&w=200&auto=format&fit=crop"
        }];
        function triggerLiveToast() {
            const toast = document.getElementById('liveToast'); const
                randomOrder = sampleOrders[Math.floor(Math.random() * sampleOrders.length)];
            document.getElementById('toastCust').textContent = randomOrder.name;
            document.getElementById('toastImg').src = randomOrder.img; toast.classList.add('show'); setTimeout(() => {
                toast.classList.remove('show');
            }, 4500);
        }

        // Init on load
        window.addEventListener('DOMContentLoaded', () => {
            updateUI();
            initTimer();
            setTimeout(triggerLiveToast, 3000);
            setInterval(triggerLiveToast, 14000);
        });
    </script>
</body>

</html>
